[package]
name = "cbranch-desktop"
version = "0.1.0"
description = "SSH-forwarded desktop client for cbranch"
authors = ["cbranch contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "cbranch_desktop"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = "2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
