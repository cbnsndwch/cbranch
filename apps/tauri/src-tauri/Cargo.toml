[package]
name = "cbranch-desktop"
version = "0.2.1"
description = "SSH-forwarded desktop client for cbranch"
authors = ["cbranch contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "cbranch_desktop"
crate-type = ["cdylib", "rlib"]

[features]
canary-devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
