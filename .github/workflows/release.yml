name: Release desktop clients

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate release version
        run: pnpm release:check

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run quality gate
        run: pnpm gate

  server-bundle:
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Package Linux server bundle
        run: pnpm package:server-bundle

      - name: Upload server bundle
        uses: actions/upload-artifact@v7
        with:
          name: cbranch-server-linux-x64
          path: apps/tauri/src-tauri/resources/cbranch-server.tar.gz
          if-no-files-found: error

  build:
    needs: [gate, server-bundle]
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: windows-x64
            path: apps/tauri/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Download server bundle
        uses: actions/download-artifact@v8
        with:
          name: cbranch-server-linux-x64
          path: apps/tauri/src-tauri/resources

      - name: Build native desktop bundles
        run: >-
          pnpm --filter @cbranch/tauri exec tauri build
          --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Upload release bundles
        uses: actions/upload-artifact@v7
        with:
          name: cbranch-${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Download release bundles
        uses: actions/download-artifact@v8
        with:
          pattern: cbranch-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        run: sha256sum release-assets/* > release-assets/SHA256SUMS.txt

      - name: Extract approved release notes
        run: >-
          node scripts/extract-release-notes.mjs "$RELEASE_TAG"
          > release-notes.md

      - name: Publish GitHub Release
        run: >-
          gh release create "$RELEASE_TAG" release-assets/*
          --title "$RELEASE_TAG" --notes-file release-notes.md
