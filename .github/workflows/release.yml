name: Release desktop clients

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate release version
        run: pnpm release:check

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run quality gate
        run: pnpm gate

  build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: windows-x64
            path: apps/tauri/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: dmg
            artifact: macos-arm64
            path: apps/tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - os: macos-13
            target: x86_64-apple-darwin
            bundles: dmg
            artifact: macos-x64
            path: apps/tauri/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            artifact: ubuntu-x64
            path: |
              apps/tauri/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              apps/tauri/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          build-essential libayatana-appindicator3-dev librsvg2-dev libssl-dev
          libwebkit2gtk-4.1-dev libxdo-dev patchelf

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build native desktop bundles
        run: >-
          pnpm --filter @cbranch/tauri exec tauri build
          --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Upload release bundles
        uses: actions/upload-artifact@v7
        with:
          name: cbranch-${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download release bundles
        uses: actions/download-artifact@v8
        with:
          pattern: cbranch-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        run: sha256sum release-assets/* > release-assets/SHA256SUMS.txt

      - name: Publish GitHub Release
        run: >-
          gh release create "$RELEASE_TAG" release-assets/*
          --title "$RELEASE_TAG" --generate-notes
