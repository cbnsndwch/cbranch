name: Release desktop clients

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate release version
        run: pnpm release:check

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run quality gate
        run: pnpm gate

  server-bundle:
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Package Linux server bundle
        run: pnpm package:server-bundle

      - name: Upload server bundle
        uses: actions/upload-artifact@v7
        with:
          name: cbranch-server-linux-x64
          path: apps/tauri/src-tauri/resources/cbranch-server.tar.gz
          if-no-files-found: error

  build:
    needs: [gate, server-bundle]
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: windows-x64
            path: apps/tauri/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri
          shared-key: tauri-${{ matrix.target }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Download server bundle
        uses: actions/download-artifact@v8
        with:
          name: cbranch-server-linux-x64
          path: apps/tauri/src-tauri/resources

      - name: Build signed updater release draft
        uses: tauri-apps/tauri-action@v0.6.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ${{ env.RELEASE_TAG }}
          releaseBody: ''
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          tauriScript: pnpm exec tauri
          projectPath: apps/tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Download draft release assets
        run: gh release download "$RELEASE_TAG" --dir release-assets

      - name: Create checksums
        run: sha256sum release-assets/* > release-assets/SHA256SUMS.txt

      - name: Extract approved release notes
        run: >-
          node scripts/extract-release-notes.mjs "$RELEASE_TAG"
          > release-notes.md

      - name: Publish GitHub Release
        run: >-
          gh release upload "$RELEASE_TAG" release-assets/SHA256SUMS.txt
          --clobber && gh release edit "$RELEASE_TAG" --draft=false
          --notes-file release-notes.md
