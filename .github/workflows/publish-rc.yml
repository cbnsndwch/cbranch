name: Publish Canary

on:
  push:
    tags:
      - 'v*-rc.*'
  workflow_dispatch:
    inputs:
      rc_version:
        description: 'Version in the form X.Y.Z-rc.N'
        required: true

permissions:
  contents: write

concurrency:
  group: publish-canary
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm gate

  server-bundle:
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:server-bundle
      - uses: actions/upload-artifact@v7
        with:
          name: cbranch-canary-server-linux-x64
          path: apps/tauri/src-tauri/resources/cbranch-server.tar.gz
          if-no-files-found: error

  publish:
    needs: [gate, server-bundle]
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri
          shared-key: tauri-canary-x86_64-pc-windows-msvc

      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION='${{ inputs.rc_version }}'
          else
            TAG="${GITHUB_REF_NAME}"
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]
            VERSION="${TAG#v}"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: cbranch-canary-server-linux-x64
          path: apps/tauri/src-tauri/resources
      - name: Build Canary overlay
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const path = "apps/tauri/src-tauri/tauri.canary.conf.json";
            const config = JSON.parse(fs.readFileSync(path, "utf8"));
            config.version = process.env.VERSION;
            fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");
          '

      - name: Assert isolated Canary identity
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const base = JSON.parse(fs.readFileSync("apps/tauri/src-tauri/tauri.conf.json", "utf8"));
            const overlay = JSON.parse(fs.readFileSync("apps/tauri/src-tauri/tauri.canary.conf.json", "utf8"));
            const merged = { ...base, ...overlay, plugins: { ...base.plugins, ...overlay.plugins, updater: { ...base.plugins.updater, ...overlay.plugins.updater } } };
            if (merged.productName !== "cBranch Canary" || merged.identifier !== "dev.cbranch.desktop.canary") process.exit(1);
            if (!merged.version.includes("-rc.") || merged.plugins.updater.endpoints.some(endpoint => endpoint.includes("releases/latest/"))) process.exit(1);
          '

      - name: Build signed Canary release
        id: tauri
        uses: tauri-apps/tauri-action@v0.6.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CBRANCH_SERVER_VARIANT: canary
          VITE_CBRANCH_CANARY: '1'
        with:
          tagName: ${{ github.ref_name }}
          releaseName: cBranch Canary ${{ env.VERSION }}
          releaseBody: Canary builds are for plugin-system testing only.
          # GitHub permits uploading action assets while a release is a draft, then
          # locks the completed per-version prerelease as immutable.
          releaseDraft: true
          prerelease: true
          includeUpdaterJson: true
          tauriScript: pnpm exec tauri
          projectPath: apps/tauri
          args: --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.canary.conf.json

      - name: Publish the Canary update manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir canary-feed
          gh release download "$GITHUB_REF_NAME" --pattern latest.json --dir canary-feed
          git fetch origin canary || true
          if git show-ref --verify --quiet refs/remotes/origin/canary; then
            git worktree add canary-branch origin/canary
          else
            git init canary-branch
            git -C canary-branch checkout --orphan canary
          fi
          git -C canary-branch config user.name github-actions[bot]
          git -C canary-branch config user.email 41898282+github-actions[bot]@users.noreply.github.com
          cp canary-feed/latest.json canary-branch/latest.json
          git -C canary-branch add latest.json
          git -C canary-branch commit -m "chore(canary): publish $VERSION"
          git -C canary-branch push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:canary
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease

      - name: Assert Canary bundle identity
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          echo "$ARTIFACT_PATHS" | node -e '
            const paths = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const names = paths.map(path => path.split(/[\\/]/).pop());
            if (!names.some(name => name.startsWith("cBranch Canary"))) process.exit(1);
            if (names.some(name => name.startsWith("cbranch_"))) process.exit(1);
          '
