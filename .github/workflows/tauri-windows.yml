name: Tauri Windows

on:
  push:
    branches: [develop]
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'apps/tauri/**'
      - 'apps/web-server/**'
      - 'packages/core/**'
      - 'packages/rpc-contract/**'
      - 'packages/ui/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'

permissions:
  contents: read

concurrency:
  group: tauri-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tauri-windows:
    name: Tauri Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Check and test Tauri shell
        run: pnpm --filter @cbranch/tauri tauri:fmt:check; pnpm --filter @cbranch/tauri tauri:test

      - name: Build NSIS installer
        run: pnpm --filter @cbranch/tauri tauri:build

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v6
        with:
          name: cbranch-windows-installer
          path: apps/tauri/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
