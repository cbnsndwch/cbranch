name: Tauri Windows

on:
  push:
    branches: [develop]
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'apps/tauri/**'
      - 'apps/web-server/**'
      - 'packages/core/**'
      - 'packages/rpc-contract/**'
      - 'packages/ui/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'

permissions:
  contents: read

concurrency:
  group: tauri-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tauri-windows:
    name: Tauri Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri
          shared-key: tauri-x86_64-pc-windows-msvc
          # Only write the cache from develop so PR builds restore but don't
          # evict the base cache with PR-specific churn.
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Package server bundle
        run: pnpm package:server-bundle

      - name: Check Tauri shell test build
        run: >-
          pnpm --filter @cbranch/tauri tauri:fmt:check;
          cargo test --manifest-path apps/tauri/src-tauri/Cargo.toml --no-run

      - name: Build NSIS installer
        run: pnpm --filter @cbranch/tauri tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v6
        with:
          name: cbranch-windows-installer
          path: apps/tauri/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
